# Copy to /etc/nginx/conf.d/cochill-gzip.conf, then: sudo nginx -t && sudo systemctl reload nginx
# Production's nginx.conf already has "gzip on;", which alone compresses only HTML.
# API JSON is left out on purpose: it is small, and compressing session data over
# HTTPS carries BREACH-style risk.
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript image/svg+xml;
